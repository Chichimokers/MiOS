<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MiOS">
  <title>MiOS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1A2A"/>
      <stop offset="0.55" stop-color="#071220"/>
      <stop offset="1" stop-color="#04070D"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="cur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset="0.5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="sq">
      <rect x="40" y="40" width="432" height="432" rx="104"/>
    </clipPath>
  </defs>

  <!-- pines tipo chip (kernel) -->
  <g fill="#22D3EE" fill-opacity="0.22">
    <rect x="12" y="140" width="24" height="22" rx="7"/>
    <rect x="12" y="246" width="24" height="22" rx="7"/>
    <rect x="12" y="352" width="24" height="22" rx="7"/>
    <rect x="476" y="140" width="24" height="22" rx="7"/>
    <rect x="476" y="246" width="24" height="22" rx="7"/>
    <rect x="476" y="352" width="24" height="22" rx="7"/>
    <rect x="140" y="12" width="22" height="24" rx="7"/>
    <rect x="246" y="12" width="22" height="24" rx="7"/>
    <rect x="352" y="12" width="22" height="24" rx="7"/>
    <rect x="140" y="476" width="22" height="24" rx="7"/>
    <rect x="246" y="476" width="22" height="24" rx="7"/>
    <rect x="352" y="476" width="22" height="24" rx="7"/>
  </g>

  <!-- cuerpo -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="40" y="40" width="432" height="432" fill="url(#grid)"/>
    <rect x="40" y="40" width="432" height="432" fill="url(#halo)"/>
  </g>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- prompt >_ -->
  <polyline points="170,186 256,256 170,326" fill="none" stroke="url(#chev)"
            stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <rect x="278" y="288" width="58" height="38" rx="9" fill="url(#cur)" filter="url(#glow)"/>
</svg>
